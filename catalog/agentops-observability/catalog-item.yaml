catalog_item_id: agentops-observability
display_name: 'AgentOps in Production: End-to-End Observability with Red Hat AI'
description: Investigate a production-style multi-agent mortgage application through
  OpenShift metrics and logs, Grafana dashboards, MLflow tracing and evaluation, and
  Red Hat OpenShift AI pipelines on Intel infrastructure.
category: guided_build
version: 0.1.0
status: draft
required_capabilities:
- openshift
- showroom
- model_endpoint
- embedding_endpoint
- agentops_observability_stack
- rhoai
- mlflow
- user_workload_monitoring
- openshift_logging
- data_science_pipelines
default_hardware_profile: xeon-basic
default_quota_profile: large
default_ttl: 4h
provisioner_refs:
- helm-workload
- showroom
validation_refs:
- pod-ready
- route-accessible
- inference-health
- agentops-journey
observability_profile: agentops-full-stack
supported_branding:
- redhat-intel-default
- intel-internal
metadata:
  showroom: true
  operator_workshop: true
  content_only: false
  onboarding_managed: true
  onboarding_contract: catalog-onboarding/agentops-observability.yaml
  certification_stage: implementation
  max_workshop_seats: 1
  promotion_sequence:
  - 1
  - 5
  - 25
  activation_blockers:
  - Repeat the one-seat run through the Launchpad provisioner. The pinned chart, application
    agent path, embeddings, shared MLflow trace, DSPA, Grafana, and automatic zero-residue
    Helm reclaim were proven live on Arena, but the test did not create a persisted
    Launchpad order, workload Application, or Showroom.
  - Prove generated runtime Secret creation, retry preservation, model-key revocation,
    and Launchpad-driven reclaim live. The direct chart reclaim left zero residue,
    and unit tests confirm that no credentials are serialized into the Argo CD Application.
  - 'Validate generated URLs for all eight RHDP tabs: OpenShift Console, Terminal,
    shared MLflow, per-seat Mortgage AI, per-seat Grafana, shared RHOAI, MLflow Docs,
    and RHOAI Docs.'
  - Deploy and live-certify the Launchpad entitlement gateway proxy for every participant
    workload and shared-service route, including cross-seat and cross-tenant denial.
    Local contracts prove catalog-only allowlisting, Showroom tab rewriting, WebSocket
    support, and origin escape rejection.
  - Certify the Arena participant route for shared MLflow and per-seat Grafana, and
    install and certify OpenShift Logging/Loki. Shared MLflow 3.14.0, workspace-scoped
    write authorization, OpenShift AI 3.5, Data Science Pipelines, and a seven-span
    AgentOps trace were confirmed live on 2026-09-05. Trusted external TLS is still RED.
  - Replace shared MLflow SQLite with PostgreSQL and enable service-ca TLS for the
    per-seat RHOAI pipeline MariaDB connection before promotion beyond one seat.
  - Complete one-seat functional certification, including app, trace, metrics, logs,
    evaluation, Showroom, access isolation, and full reclaim.
  showroom_journey: agentops-observability
  showroom_title: 'AgentOps in Production: End-to-End Observability with Red Hat AI'
  showroom_content_repo_url: https://github.com/rhpds/launchpad.git
  showroom_content_ref: 0d697f3ddd1e5008dfd9bb32c3e3bdd0398383a9
  showroom_content_playbook: site-agentops-observability.yml
  showroom_content_start_path: content-agentops-observability
  showroom_tabs:
  - id: openshift-console
    title: OpenShift Console
    source: cluster.console_url
  - id: terminal
    title: Terminal
    source: showroom.terminal
  - id: mlflow
    title: MLflow Console
    source: cluster.mlflow_url
  - id: mortgage-ai
    title: Mortgage AI App
    source: workload.route.ui
  - id: grafana
    title: Grafana
    source: workload.route.grafana
  - id: rhoai
    title: RHOAI Console
    source: cluster.rhoai_url
  - id: mlflow-docs
    title: MLflow Docs
    source: https://mlflow.org/docs/latest/genai/tracing/
  - id: rhoai-docs
    title: RHOAI Docs
    source: https://docs.redhat.com/en/documentation/red_hat_openshift_ai_self-managed/
  required_models:
  - granite-3.2-8b-tools
  inference_endpoint: litellm
  seat_cpu_millicores: 2500
  seat_memory_mib: 7168
  seat_pods: 15
  seat_storage_gib: 30
  workload_repo: https://github.com/rhpds/launchpad.git
  workload_revision: 6936ee6b9d64df8ccda8902279b8cc3a1e4c0545
  workload_deploy_type: helm
  workload_deployment_scope: seat
  workload_deploy_path: deploy/workloads/agentops-seat
  workload_source_kind: launchpad-seat-chart
  workload_gitops_ready: false
  workload_release_name: agentops
  workload_helm_values:
    storageClass: launchpad-nfs-ephemeral
  workload_runtime_secret_name: agentops-runtime
  workload_runtime_secret_sources:
    POSTGRES_DB:
      value: mortgage-ai
    POSTGRES_USER:
      value: agentops
    POSTGRES_PASSWORD:
      source: generated_password
      length: 32
    LENDING_DB_PASSWORD:
      source: generated_password
      length: 32
    COMPLIANCE_DB_PASSWORD:
      source: generated_password
      length: 32
    MLPIPELINE_PASSWORD:
      source: generated_password
      length: 32
    MIGRATION_DATABASE_URL:
      template: postgresql+asyncpg://{POSTGRES_USER}:{POSTGRES_PASSWORD}@mortgage-ai-db:5432/mortgage-ai
    DATABASE_URL:
      template: postgresql+asyncpg://lending_app:{LENDING_DB_PASSWORD}@mortgage-ai-db:5432/mortgage-ai
    COMPLIANCE_DATABASE_URL:
      template: postgresql+asyncpg://compliance_app:{COMPLIANCE_DB_PASSWORD}@mortgage-ai-db:5432/mortgage-ai
    DEBUG:
      value: 'false'
    ALLOWED_HOSTS:
      value: '["*"]'
    COMPANY_NAME:
      value: Fed Aura Capital
    AGENT_NAME:
      value: Intel Xeon AgentOps
    AUTH_DISABLED:
      value: 'true'
    S3_ACCESS_KEY:
      source: generated_password
      length: 24
    S3_SECRET_KEY:
      source: generated_password
      length: 32
    S3_ENDPOINT:
      value: http://minio-service:9000
    S3_BUCKET:
      value: documents
    S3_REGION:
      value: us-east-1
    UPLOAD_MAX_SIZE_MB:
      value: '50'
    LLM_API_KEY:
      source: maas_api_key
    LLM_BASE_URL:
      source: maas_endpoint
    LLM_MODEL:
      source: requested_model
    LLM_MODEL_FAST:
      source: requested_model
    LLM_MODEL_CAPABLE:
      source: requested_model
    EMBEDDING_MODEL:
      value: nomic-embed-text-v1.5
    EMBEDDING_PROVIDER:
      value: openai_compatible
    EMBEDDING_BASE_URL:
      source: model_endpoint
      model: nomic-embed-text-v1.5
    MLFLOW_TRACKING_URI:
      value: https://mlflow.redhat-ods-applications.svc.cluster.local:8443/mlflow
    MLFLOW_EXPERIMENT_NAME:
      value: mortgage-ai
    MLFLOW_WORKSPACE:
      source: namespace
    MLFLOW_TRACKING_AUTH:
      value: kubernetes
    MLFLOW_TRACKING_INSECURE_TLS:
      value: 'true'
