    - "Define and validate generated URLs for Mortgage AI, MLflow, Grafana, OpenShift Console, RHOAI, and Terminal Showroom tabs."
    - "Reconcile the upstream username/password instructions with Launchpad participant SSO and namespace-scoped RBAC; remove or replace the chart's cluster-scoped MLflow RBAC and per-seat Keycloak deployment."
