catalog_item_id: agentops-observability
display_name: 'AgentOps in Production: End-to-End Observability with Red Hat AI'
description: Investigate a production-style multi-agent mortgage application through
  OpenShift metrics and logs, Grafana dashboards, MLflow tracing and evaluation, and
  Red Hat OpenShift AI pipelines on Intel infrastructure.
category: guided_build
version: 0.1.0
status: draft
required_capabilities:
- openshift
- showroom
- model_endpoint
- agentops_observability_stack
- rhoai
- mlflow
- user_workload_monitoring
- openshift_logging
- data_science_pipelines
default_hardware_profile: xeon-basic
default_quota_profile: large
default_ttl: 4h
provisioner_refs:
- helm-workload
- showroom
validation_refs:
- pod-ready
- route-accessible
- inference-health
- agentops-journey
observability_profile: agentops-full-stack
supported_branding:
- redhat-intel-default
- intel-internal
metadata:
  showroom: true
  operator_workshop: true
  content_only: false
  onboarding_managed: true
  onboarding_contract: catalog-onboarding/agentops-observability.yaml
  certification_stage: intake
  max_workshop_seats: 1
  promotion_sequence:
  - 1
  - 5
  - 25
  activation_blockers:
  - Choose the production content-delivery path, retain immutable source provenance,
    and replace the Showroom's mutable latest UI bundle with a pinned release before
    mirroring or adapting content into Launchpad.
  - Adapt the RHDP app-of-apps so cluster-global RHOAI, MLflow, monitoring, logging,
    and image-puller Applications are installed once on Arena while uniquely named
    namespace-scoped Applications are created per workshop seat. The current upstream
    bootstrap uses global names and cannot be instantiated safely by concurrent Launchpad
    orders.
  - Complete the AgentOps runtime Secret mapping without serializing the LiteMaaS
    virtual key into an Argo CD Application. The upstream bootstrap currently passes
    the token through Helm values.
  - 'Validate generated URLs for all eight RHDP tabs: OpenShift Console, Terminal,
    shared MLflow, per-seat Mortgage AI, per-seat Grafana, shared RHOAI, MLflow Docs,
    and RHOAI Docs.'
  - Reconcile the RHDP user/common-password instructions with Launchpad participant
    SSO and namespace-scoped RBAC; review and reduce the upstream MLflow and Grafana
    cluster-scoped bindings.
  - Install and certify an Arena participant route for shared MLflow, per-seat Grafana,
    and OpenShift Logging/Loki. OpenShift AI 3.5, a Ready DataScienceCluster, user
    workload monitoring, and Data Science Pipelines were confirmed live on 2026-09-04.
  - Select and load a workshop-capable model, then update the Showroom's qwen3-14b
    statements if a different model is certified.
  - Complete one-seat functional certification, including app, trace, metrics, logs,
    evaluation, Showroom, access isolation, and full reclaim.
