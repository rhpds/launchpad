catalog_item_id: multi-agent-quickstart
display_name: Build Multi-Agent AI Systems with Open Protocols
description: Build and inspect three cooperating A2A agents with semantic routing,
  MCP tool calling, guardrails, service authentication, and OpenTelemetry on Intel
  infrastructure and Red Hat OpenShift.
category: guided_build
version: 0.1.0
status: draft
required_capabilities:
- openshift
- showroom
- model_endpoint
default_hardware_profile: xeon-basic
default_quota_profile: large
default_ttl: 4h
provisioner_refs:
- helm-workload
- showroom
validation_refs:
- pod-ready
- route-accessible
- inference-health
- multi-agent-journey
observability_profile: multi-agent-open-protocols
supported_branding:
- redhat-intel-default
- intel-internal
metadata:
  showroom: true
  operator_workshop: true
  content_only: false
  onboarding_managed: true
  onboarding_contract: catalog-onboarding/multi-agent-quickstart.yaml
  certification_stage: source-import
  max_workshop_seats: 1
  promotion_sequence:
  - 1
  - 5
  - 25
  activation_blockers:
  - Publish the application image in a durable registry and replace every mutable
    or inaccessible image reference with an immutable digest.
  - Add the Gradio participant UI to the OpenShift chart with a Service and Route
    compatible with the Launchpad entitlement gateway.
  - Add a runtime Secret contract for the per-session MaaS endpoint and key; inject
    credentials into the orchestrator and agent pods without placing secret values
    in Git or Argo CD Application values.
  - Label every workload resource with its workshop, seat, session, tenant, and cluster
    identity and prove cleanup targets only the persisted cluster.
  - Add inference-aware readiness and validate a real three-agent A2A workflow, MCP
    tool enrichment, semantic routing, and guardrail denial.
  - Complete one-seat participant authorization, cross-seat denial, and zero-residue
    reclaim evidence on Arena before activation.
  - Complete measured five-seat and twenty-five-seat certification before raising
    the catalog workshop limit above the proven safe value.
