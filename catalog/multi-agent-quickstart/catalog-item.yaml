catalog_item_id: multi-agent-quickstart
display_name: Build Multi-Agent AI Systems with Open Protocols
description: Build and inspect three cooperating A2A agents with semantic routing,
  MCP tool calling, guardrails, service authentication, and OpenTelemetry on Intel
  infrastructure and Red Hat OpenShift.
category: guided_build
version: 0.1.0
status: draft
