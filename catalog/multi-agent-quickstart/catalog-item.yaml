catalog_item_id: multi-agent-quickstart
display_name: Build Multi-Agent AI Systems with Open Protocols
description: 'Follow three learning tracks in one environment: study the local multi-agent
  application pattern, operate it on OpenShift, and explore its advanced blueprint
  alignment with A2A, MCP, Kagenti, OpenTelemetry, guardrails, and service authentication
  on Intel infrastructure.'
category: guided_build
version: 0.2.0
status: draft
required_capabilities:
- openshift
- showroom
- model_endpoint
default_hardware_profile: xeon-basic
default_quota_profile: large
default_ttl: 4h
provisioner_refs:
- helm-workload
- showroom
validation_refs:
- pod-ready
- route-accessible
- inference-health
- multi-agent-journey
observability_profile: multi-agent-open-protocols
supported_branding:
- redhat-intel-default
- intel-internal
metadata:
  showroom: true
  operator_workshop: true
  content_only: false
  onboarding_managed: true
  onboarding_contract: catalog-onboarding/multi-agent-quickstart.yaml
  certification_stage: one-seat-certified
  max_workshop_seats: 1
  promotion_sequence:
  - 1
  - 5
  - 25
  activation_blockers:
  - Mirror the Arena-built, digest-pinned candidate image to a durable external registry
    or durable control-plane mirror before production; Arena's internal registry is
    sufficient only for certification.
  - Certify public-code participant login, entitlement enforcement, and cross-seat
    denial before enabling external participant access.
  - Track 3 is currently an architecture and manifest exploration path; certify Kagenti
    and OpenTelemetry runtime integrations before presenting those optional blueprint
    components as deployed services.
  - Complete measured five-seat and twenty-five-seat certification before raising
    the catalog workshop limit above the proven safe value.
