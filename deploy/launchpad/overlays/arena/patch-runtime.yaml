apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  annotations:
    launchpad.redhat.com/ha-blocker: in-memory-session-cache-must-be-externalized-before-replicas-exceed-one
spec:
  template:
    spec:
      containers:
        - name: backend
          volumeMounts:
            - name: cluster-targets
              mountPath: /etc/launchpad
              readOnly: true
      volumes:
        - name: cluster-targets
          configMap:
            name: launchpad-cluster-targets
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: partner-portal
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 0
  template:
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: partner-portal
---
