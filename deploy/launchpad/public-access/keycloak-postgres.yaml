apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: keycloak-postgres
  namespace: keycloak
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: nfs-storage
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak-postgres
  namespace: keycloak
  labels: {app.kubernetes.io/name: keycloak-postgres}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: keycloak-postgres}
  template:
    metadata:
      labels: {app.kubernetes.io/name: keycloak-postgres}
    spec:
      containers:
        - name: postgres
          image: registry.redhat.io/rhel9/postgresql-15:latest
          ports: [{name: postgres, containerPort: 5432}]
          env:
            - {name: POSTGRESQL_DATABASE, value: keycloak}
            - {name: POSTGRESQL_USER, valueFrom: {secretKeyRef: {name: keycloak-db, key: username}}}
            - {name: POSTGRESQL_PASSWORD, valueFrom: {secretKeyRef: {name: keycloak-db, key: password}}}
          readinessProbe:
            exec: {command: [/bin/sh, -c, pg_isready -U "$POSTGRESQL_USER" -d "$POSTGRESQL_DATABASE"]}
            initialDelaySeconds: 10
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "1", memory: 1Gi}
          volumeMounts:
            - {name: data, mountPath: /var/lib/pgsql/data}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: keycloak-postgres}
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak-postgres
  namespace: keycloak
spec:
  selector: {app.kubernetes.io/name: keycloak-postgres}
  ports: [{name: postgres, port: 5432, targetPort: postgres}]

