apiVersion: v1
kind: Service
metadata:
  name: mlflow-postgres
  namespace: redhat-ods-applications
  labels:
    app.kubernetes.io/name: mlflow-postgres
    app.kubernetes.io/part-of: partner-ai-launchpad
    launchpad.redhat.com/cluster-id: arena
    launchpad.redhat.com/shared-service: "true"
spec:
  selector:
    app.kubernetes.io/name: mlflow-postgres
  ports:
    - name: postgresql
      port: 5432
      targetPort: postgresql
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mlflow-postgres
  namespace: redhat-ods-applications
  labels:
    app.kubernetes.io/name: mlflow-postgres
    app.kubernetes.io/part-of: partner-ai-launchpad
    launchpad.redhat.com/cluster-id: arena
    launchpad.redhat.com/shared-service: "true"
spec:
  serviceName: mlflow-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mlflow-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mlflow-postgres
        app.kubernetes.io/part-of: partner-ai-launchpad
        launchpad.redhat.com/cluster-id: arena
        launchpad.redhat.com/shared-service: "true"
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgresql
          image: registry.redhat.io/rhel9/postgresql-16@sha256:8fd1bbd8d006ae5bb892c6d633c9d92fb980caed470199effaf2343099fcdb89
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          env:
            - name: POSTGRESQL_USER
              valueFrom:
                secretKeyRef:
                  name: mlflow-postgres
                  key: database-user
            - name: POSTGRESQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mlflow-postgres
                  key: database-password
            - name: POSTGRESQL_DATABASE
              valueFrom:
                secretKeyRef:
                  name: mlflow-postgres
                  key: database-name
          ports:
            - name: postgresql
              containerPort: 5432
          readinessProbe:
            exec:
              command:
                - bash
                - -c
                - psql -w -U "$POSTGRESQL_USER" -d "$POSTGRESQL_DATABASE" -c 'SELECT 1'
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command:
                - bash
                - -c
                - /usr/bin/pg_isready -U "$POSTGRESQL_USER" -d "$POSTGRESQL_DATABASE"
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 2
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 4Gi
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/pgsql/data
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
        labels:
          app.kubernetes.io/name: mlflow-postgres
          app.kubernetes.io/part-of: partner-ai-launchpad
          launchpad.redhat.com/cluster-id: arena
          launchpad.redhat.com/shared-service: "true"
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: nfs-storage
        resources:
          requests:
            storage: 50Gi
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: mlflow-postgres
  namespace: redhat-ods-applications
  labels:
    app.kubernetes.io/name: mlflow-postgres
    app.kubernetes.io/part-of: partner-ai-launchpad
    launchpad.redhat.com/cluster-id: arena
    launchpad.redhat.com/shared-service: "true"
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mlflow-postgres
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mlflow-postgres
  namespace: redhat-ods-applications
  labels:
    app.kubernetes.io/name: mlflow-postgres
    app.kubernetes.io/part-of: partner-ai-launchpad
    launchpad.redhat.com/cluster-id: arena
    launchpad.redhat.com/shared-service: "true"
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: mlflow-postgres
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: mlflow
      ports:
        - protocol: TCP
          port: 5432
---
apiVersion: mlflow.opendatahub.io/v1
kind: MLflow
metadata:
  name: mlflow
  namespace: redhat-ods-applications
  labels:
    app.kubernetes.io/name: mlflow
    app.kubernetes.io/part-of: partner-ai-launchpad
    launchpad.redhat.com/cluster-id: arena
    launchpad.redhat.com/shared-service: "true"
spec:
  # The bootstrap script creates this Secret directly on Arena. The URI and
  # password are never stored in Git or serialized into the MLflow resource.
  backendStoreUriFrom:
    name: mlflow-postgres
    key: backend-store-uri
  migration:
    mode: Automatic
  serveArtifacts: true
  artifactsDestination: file:///mlflow/artifacts
  replicas: 1
  workers: 2
  # File-backed artifacts still require this RWO volume. A supported external
  # object store is required before promoting the service to HA replicas.
  storage:
    accessModes:
      - ReadWriteOnce
    resources:
      requests:
        storage: 20Gi
    storageClassName: launchpad-nfs-ephemeral
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 4Gi
  workspaceLabelSelector:
    matchExpressions:
      - key: launchpad.redhat.com/session-id
        operator: Exists
