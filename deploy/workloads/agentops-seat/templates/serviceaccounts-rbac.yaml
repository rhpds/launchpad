apiVersion: v1
kind: ServiceAccount
metadata:
  name: agentops-seat
  labels:
    {{- include "agentops.labels" . | nindent 4 }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: agentops-grafana
  labels:
    {{- include "agentops.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: agentops-mlflow-client
  labels:
    {{- include "agentops.labels" . | nindent 4 }}
rules:
  - apiGroups: ["mlflow.kubeflow.org"]
    resources: ["experiments", "datasets", "registeredmodels"]
    verbs: ["get", "list", "create", "update", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: agentops-mlflow-client
  labels:
    {{- include "agentops.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: agentops-mlflow-client
subjects:
  - kind: ServiceAccount
    name: agentops-seat
    namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: agentops-grafana-metrics
  labels:
    {{- include "agentops.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-monitoring-view
subjects:
  - kind: ServiceAccount
    name: agentops-grafana
    namespace: {{ .Release.Namespace }}
