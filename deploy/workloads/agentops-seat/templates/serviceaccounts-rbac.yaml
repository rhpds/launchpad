apiVersion: v1
kind: ServiceAccount
metadata:
  name: agentops-seat
  labels:
    {{- include "agentops.labels" . | nindent 4 }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: agentops-grafana
  labels:
    {{- include "agentops.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: agentops-grafana-metrics
  labels:
    {{- include "agentops.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-monitoring-view
subjects:
  - kind: ServiceAccount
    name: agentops-grafana
    namespace: {{ .Release.Namespace }}
