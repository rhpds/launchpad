{{- if .Values.dspa.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: agentops-pipeline-database
  labels:
    {{- include "agentops.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: pipeline-database
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              component: data-science-pipelines
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: pipeline-database
              app.kubernetes.io/instance: {{ .Release.Name }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: redhat-ods-applications
          podSelector:
            matchLabels:
              app.kubernetes.io/name: data-science-pipelines-operator
      ports:
        - protocol: TCP
          port: 3306
{{- end }}
