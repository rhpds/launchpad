apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pipeline-db-data
  labels:
    {{- include "agentops.labels" . | nindent 4 }}
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: {{ .Values.storageClass | quote }}
  resources:
    requests:
      storage: {{ .Values.dspa.storage | quote }}
---
apiVersion: v1
kind: Service
metadata:
  name: agentops-pipeline-db
  labels:
    {{- include "agentops.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/component: pipeline-database
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: mysql
      port: 3306
      targetPort: mysql
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentops-pipeline-db
  labels:
    {{- include "agentops.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/component: pipeline-database
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        {{- include "agentops.labels" . | nindent 8 }}
        app.kubernetes.io/component: pipeline-database
    spec:
      serviceAccountName: agentops-seat
      securityContext:
        {{- include "agentops.podSecurityContext" . | nindent 8 }}
      containers:
        - name: mariadb
          image: {{ .Values.images.mariadb | quote }}
          imagePullPolicy: IfNotPresent
          securityContext:
            {{- include "agentops.containerSecurityContext" . | nindent 12 }}
          env:
            - name: MYSQL_USER
              value: mlpipeline
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef: {name: {{ include "agentops.runtimeSecret" . }}, key: MLPIPELINE_PASSWORD}
            - name: MYSQL_DATABASE
              value: mlpipeline
            - name: MYSQL_ALLOW_EMPTY_PASSWORD
              value: "true"
          ports:
            - name: mysql
              containerPort: 3306
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -i
                - -c
                - MYSQL_PWD=$MYSQL_PASSWORD mysql -h 127.0.0.1 -u $MYSQL_USER -D $MYSQL_DATABASE -e 'SELECT 1'
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 1
          livenessProbe:
            tcpSocket:
              port: mysql
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 1
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "chmod -R a+rwx /var/lib/mysql || true"]
          resources:
            {{- toYaml .Values.resources.pipelineDatabase | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: pipeline-db-data
