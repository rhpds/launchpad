apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pipeline-db-data
  labels:
    {{- include "agentops.labels" . | nindent 4 }}
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: {{ .Values.storageClass | quote }}
  resources:
    requests:
      storage: {{ .Values.dspa.storage | quote }}
---
apiVersion: v1
kind: Service
metadata:
  name: agentops-pipeline-db
  annotations:
    service.beta.openshift.io/serving-cert-secret-name: agentops-pipeline-db-tls
  labels:
    {{- include "agentops.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/component: pipeline-database
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: mysql
      port: 3306
      targetPort: mysql
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentops-pipeline-db
  labels:
    {{- include "agentops.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/component: pipeline-database
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        {{- include "agentops.labels" . | nindent 8 }}
        app.kubernetes.io/component: pipeline-database
    spec:
      serviceAccountName: agentops-seat
      securityContext:
        {{- include "agentops.podSecurityContext" . | nindent 8 }}
      initContainers:
        - name: prepare-mariadb-tls
          image: {{ .Values.images.mariadb | quote }}
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - >-
              cp /serving-cert/tls.crt /work/tls.crt &&
              cp /serving-cert/tls.key /work/tls.key &&
              chmod 0644 /work/tls.crt &&
              chmod 0600 /work/tls.key
          securityContext:
            {{- include "agentops.containerSecurityContext" . | nindent 12 }}
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {cpu: 100m, memory: 64Mi}
          volumeMounts:
            - name: mariadb-serving-cert
              mountPath: /serving-cert
              readOnly: true
            - name: mariadb-tls
              mountPath: /work
      containers:
        - name: mariadb
          image: {{ .Values.images.mariadb | quote }}
          imagePullPolicy: IfNotPresent
          command:
            - /usr/bin/run-mysqld
          args:
            - --ssl=ON
            - --ssl-key=/var/run/mariadb-tls/tls.key
            - --ssl-cert=/var/run/mariadb-tls/tls.crt
            - --tls-version=TLSv1.2,TLSv1.3
            - --require-secure-transport=ON
          securityContext:
            {{- include "agentops.containerSecurityContext" . | nindent 12 }}
          env:
            - name: MYSQL_USER
              value: mlpipeline
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef: {name: {{ include "agentops.runtimeSecret" . }}, key: MLPIPELINE_PASSWORD}
            - name: MYSQL_DATABASE
              value: mlpipeline
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          ports:
            - name: mysql
              containerPort: 3306
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -i
                - -c
                - >-
                  MYSQL_PWD="$MYSQL_PASSWORD" mysql --connect-timeout=5
                  --ssl-ca=/var/run/secrets/kubernetes.io/serviceaccount/service-ca.crt
                  --ssl-verify-server-cert
                  -h "agentops-pipeline-db.${POD_NAMESPACE}.svc.cluster.local"
                  -u "$MYSQL_USER" -D "$MYSQL_DATABASE" -Nse
                  "SHOW STATUS LIKE 'Ssl_version'" |
                  awk '$2 ~ /^TLSv1\.[23]$/ {found=1} END {exit !found}'
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 1
          livenessProbe:
            tcpSocket:
              port: mysql
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 1
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "chmod -R a+rwx /var/lib/mysql || true"]
          resources:
            {{- toYaml .Values.resources.pipelineDatabase | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
            - name: mariadb-tls
              mountPath: /var/run/mariadb-tls
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: pipeline-db-data
        - name: mariadb-serving-cert
          secret:
            secretName: agentops-pipeline-db-tls
        - name: mariadb-tls
          emptyDir: {}
