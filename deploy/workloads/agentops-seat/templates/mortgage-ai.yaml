apiVersion: v1
kind: Service
metadata:
  name: mortgage-ai-api
  labels:
    {{- include "agentops.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  selector:
    app.kubernetes.io/component: api
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - {name: http, port: 8000, targetPort: http}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mortgage-ai-api
  labels:
    {{- include "agentops.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: api
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        {{- include "agentops.labels" . | nindent 8 }}
        app.kubernetes.io/component: api
    spec:
      serviceAccountName: agentops-seat
      securityContext:
        {{- include "agentops.podSecurityContext" . | nindent 8 }}
      initContainers:
        - name: wait-for-database
          image: {{ .Values.images.postgres | quote }}
          securityContext:
            {{- include "agentops.containerSecurityContext" . | nindent 12 }}
          command: ["/bin/sh", "-c"]
          args: ["until pg_isready -h mortgage-ai-db -U $POSTGRES_USER -d $POSTGRES_DB; do sleep 3; done"]
          envFrom:
            - secretRef:
                name: {{ include "agentops.runtimeSecret" . }}
        - name: migrate-database
          image: {{ .Values.images.mortgageApi | quote }}
          imagePullPolicy: IfNotPresent
          securityContext:
            {{- include "agentops.containerSecurityContext" . | nindent 12 }}
          command: ["/bin/sh", "-c"]
          args: ["cd /app/packages/db && alembic upgrade head"]
          envFrom:
            - secretRef:
                name: {{ include "agentops.runtimeSecret" . }}
          env:
            - {name: PYTHONPATH, value: /app/packages/db/src:/app/packages/api/src}
      containers:
        - name: api
          image: {{ .Values.images.mortgageApi | quote }}
          imagePullPolicy: IfNotPresent
          securityContext:
            {{- include "agentops.containerSecurityContext" . | nindent 12 }}
          envFrom:
            - secretRef:
                name: {{ include "agentops.runtimeSecret" . }}
          ports:
            - {name: http, containerPort: 8000}
          readinessProbe:
            httpGet: {path: /health/, port: http}
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 20
          livenessProbe:
            httpGet: {path: /health/, port: http}
            initialDelaySeconds: 45
            periodSeconds: 15
            failureThreshold: 6
          resources:
            {{- toYaml .Values.resources.api | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: mortgage-ai-ui
  labels:
    {{- include "agentops.labels" . | nindent 4 }}
    app.kubernetes.io/component: ui
spec:
  selector:
    app.kubernetes.io/component: ui
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - {name: http, port: 8080, targetPort: http}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mortgage-ai-ui
  labels:
    {{- include "agentops.labels" . | nindent 4 }}
    app.kubernetes.io/component: ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: ui
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        {{- include "agentops.labels" . | nindent 8 }}
        app.kubernetes.io/component: ui
    spec:
      serviceAccountName: agentops-seat
      securityContext:
        {{- include "agentops.podSecurityContext" . | nindent 8 }}
      containers:
        - name: ui
          image: {{ .Values.images.mortgageUi | quote }}
          imagePullPolicy: IfNotPresent
          securityContext:
            {{- include "agentops.containerSecurityContext" . | nindent 12 }}
          env:
            - {name: API_UPSTREAM, value: "mortgage-ai-api:8000"}
            - name: COMPANY_NAME
              valueFrom:
                secretKeyRef: {name: {{ include "agentops.runtimeSecret" . }}, key: COMPANY_NAME}
            - name: AGENT_NAME
              valueFrom:
                secretKeyRef: {name: {{ include "agentops.runtimeSecret" . }}, key: AGENT_NAME}
          ports:
            - {name: http, containerPort: 8080}
          readinessProbe:
            httpGet: {path: /, port: http}
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /, port: http}
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            {{- toYaml .Values.resources.ui | nindent 12 }}
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: mortgage-ai-ui-route
  labels:
    {{- include "agentops.labels" . | nindent 4 }}
    app.kubernetes.io/component: ui
spec:
  to: {kind: Service, name: mortgage-ai-ui, weight: 100}
  port: {targetPort: http}
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  wildcardPolicy: None
