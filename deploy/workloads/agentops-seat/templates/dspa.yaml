{{- if .Values.dspa.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: agentops-pipeline-service-ca
  annotations:
    service.beta.openshift.io/inject-cabundle: "true"
  labels:
    {{- include "agentops.labels" . | nindent 4 }}
data: {}
---
apiVersion: datasciencepipelinesapplications.opendatahub.io/v1
kind: DataSciencePipelinesApplication
metadata:
  name: dspa
  labels:
    {{- include "agentops.labels" . | nindent 4 }}
spec:
  apiServer:
    deploy: true
    enableOauth: true
    enableSamplePipeline: false
    artifactSignedURLExpirySeconds: 60
    cacheEnabled: true
    pipelineStore: kubernetes
    cABundle:
      configMapName: agentops-pipeline-service-ca
      configMapKey: service-ca.crt
  database:
    disableHealthCheck: false
    # apiServer.cABundle adds the OpenShift service CA to the DSP trust bundle.
    # The chart-owned MariaDB serves a matching service certificate and rejects
    # every unencrypted client connection.
    customExtraParams: '{"tls":"true"}'
    externalDB:
      host: agentops-pipeline-db.{{ .Release.Namespace }}.svc.cluster.local
      port: "3306"
      pipelineDBName: mlpipeline
      username: mlpipeline
      passwordSecret:
        name: {{ include "agentops.runtimeSecret" . }}
        key: MLPIPELINE_PASSWORD
  dspVersion: v2
  objectStorage:
    disableHealthCheck: false
    enableExternalRoute: false
    externalStorage:
      basePath: ""
      bucket: pipeline
      host: minio-service.{{ .Release.Namespace }}.svc.cluster.local:9000
      port: ""
      region: us-east-1
      scheme: http
      s3CredentialsSecret:
        accessKey: S3_ACCESS_KEY
        secretKey: S3_SECRET_KEY
        secretName: {{ include "agentops.runtimeSecret" . }}
  persistenceAgent:
    deploy: true
    numWorkers: 2
  # RHOAI 3.5 generates an MLMD server config that repeats the database
  # connection without its TLS options when podToPodTLS is enabled. The
  # duplicate plaintext connection is rejected by require_secure_transport.
  # Keep the external database connection encrypted and CA-verified while the
  # operator defect is tracked; do not expose the internal MLMD Envoy route.
  mlmd:
    deploy: true
    envoy:
      deployRoute: false
  podToPodTLS: false
  scheduledWorkflow:
    cronScheduleTimezone: UTC
    deploy: true
{{- end }}
