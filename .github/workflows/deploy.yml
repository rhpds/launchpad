name: Launchpad Deployment Gate

on:
  workflow_dispatch:
    inputs:
      overlay:
        description: "Deployment source to validate (this workflow does not apply it)"
        required: true
        type: choice
        options:
          - arena
          - arena-ha-pilot
          - flightpath-dr

permissions:
  contents: read

jobs:
  validate:
    name: Validate ${{ inputs.overlay }} deployment source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install ".[dev]"

      - name: Run deployment and lifecycle contract tests
        env:
          PYTHONPATH: backend
        run: |
          python -m pytest \
            backend/tests/test_ha_dr_manifests.py \
            backend/tests/test_lifecycle_worker_manifest.py \
            backend/tests/test_arena_reliability_manifests.py \
            backend/tests/test_lifecycle_job_queue.py \
            -q --tb=short

      - name: Install kubectl
        uses: azure/setup-kubectl@v4

      - name: Render selected Kustomize overlay
        env:
          OVERLAY: ${{ inputs.overlay }}
          RENDER_DIR: ${{ runner.temp }}/launchpad-deployment-gate
        run: |
          mkdir -p "$RENDER_DIR"
          kubectl kustomize "deploy/launchpad/overlays/$OVERLAY" \
            > "$RENDER_DIR/$OVERLAY.yaml"
          test -s "$RENDER_DIR/$OVERLAY.yaml"

      - name: Upload rendered manifest
        uses: actions/upload-artifact@v4
        with:
          name: launchpad-${{ inputs.overlay }}-manifest
          path: ${{ runner.temp }}/launchpad-deployment-gate/${{ inputs.overlay }}.yaml

      - name: Report deployment boundary
        run: |
          echo "Validation passed for deploy/launchpad/overlays/${{ inputs.overlay }}."
          echo "This gate does not contact a cluster or perform a deployment."
          echo "Live promotion remains an explicit Argo CD/operator action."
