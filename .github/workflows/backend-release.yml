name: Launchpad Backend Release

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact 40-character source revision to build
        required: true
        type: string
      publish:
        description: Publish, sign, and attest the image after all gates pass
        required: true
        default: false
        type: boolean
      image_name:
        description: GHCR package name (use a repository-owned package when the legacy package is not writable)
        required: true
        default: launchpad-backend
        type: string

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

env:
  IMAGE_REPOSITORY: ghcr.io/${{ github.repository_owner }}/${{ inputs.image_name }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the requested revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.expected_sha }}

      - name: Fail closed on revision drift
        shell: bash
        env:
          IMAGE_NAME: ${{ inputs.image_name }}
        run: |
          set -euo pipefail
          test "${{ github.sha }}" = "${{ inputs.expected_sha }}"
          test "$(git rev-parse HEAD)" = "${{ inputs.expected_sha }}"
          test -z "$(git status --porcelain)"
          case "$IMAGE_NAME" in
            ""|*[!a-z0-9._-]*) exit 1 ;;
          esac

      - name: Set up emulation
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Build the exact linux/amd64 candidate
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: backend/Containerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ env.IMAGE_REPOSITORY }}:git-${{ inputs.expected_sha }}
          labels: |
            org.opencontainers.image.revision=${{ inputs.expected_sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Verify backend runtime surface
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --network none --read-only --user 1001 \
            --tmpfs /tmp:rw,nosuid,nodev,mode=1777 \
            --env PYTHONDONTWRITEBYTECODE=1 \
            --env HOME=/tmp --env PYTHONPATH=/opt/app-root/src \
            --entrypoint python3 \
            "${IMAGE_REPOSITORY}:git-${{ inputs.expected_sha }}" \
            scripts/runtime_smoke.py

      - name: Inventory named client security surfaces
        shell: bash
        run: |
          set -euo pipefail
          image="${IMAGE_REPOSITORY}:git-${{ inputs.expected_sha }}"
          container_id="$(docker create "$image")"
          trap 'docker rm "$container_id" >/dev/null' EXIT
          docker cp "$container_id:/usr/local/bin/oc" "$RUNNER_TEMP/launchpad-oc"
          go version -m "$RUNNER_TEMP/launchpad-oc" > client-build-info.txt
          go tool nm "$RUNNER_TEMP/launchpad-oc" > "$RUNNER_TEMP/launchpad-oc-symbols.txt"
          python3 scripts/inventory_backend_client_symbols.py \
            "$RUNNER_TEMP/launchpad-oc-symbols.txt" \
            --binary "$RUNNER_TEMP/launchpad-oc" \
            --source-revision "${{ inputs.expected_sha }}" \
            > client-symbol-inventory.json

      - name: Retain client symbol evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: backend-client-symbols-${{ inputs.expected_sha }}
          path: |
            client-build-info.txt
            client-symbol-inventory.json
            ${{ runner.temp }}/launchpad-oc-symbols.txt

      - name: Release build cache before security scanning
        shell: bash
        run: |
          set -euo pipefail
          # Preserve the loaded candidate; discard only this ephemeral runner's
          # build cache so the scanner can unpack it and its vulnerability DB.
          docker buildx prune --all --force
          docker builder prune --all --force
          df -h / /tmp

      - name: Inventory all candidate vulnerabilities
        uses: anchore/scan-action@1638637db639e0ade3258b51db49a9a137574c3e
        with:
          image: ${{ env.IMAGE_REPOSITORY }}:git-${{ inputs.expected_sha }}
          fail-build: false
          severity-cutoff: high
          output-format: json
          output-file: vulnerability-report.json

      - name: Block fixable high and critical vulnerabilities
        uses: anchore/scan-action@1638637db639e0ade3258b51db49a9a137574c3e
        with:
          image: ${{ env.IMAGE_REPOSITORY }}:git-${{ inputs.expected_sha }}
          fail-build: true
          severity-cutoff: high
          only-fixed: true
          output-format: json
          output-file: vulnerability-report-fixable.json

      - name: Retain vulnerability evidence even when the gate blocks
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: backend-vulnerability-scan-${{ inputs.expected_sha }}
          path: |
            vulnerability-report.json
            vulnerability-report-fixable.json

      - name: Generate the SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610
        with:
          image: ${{ env.IMAGE_REPOSITORY }}:git-${{ inputs.expected_sha }}
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false

      - name: Retain pre-publication evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: backend-release-${{ inputs.expected_sha }}
          path: |
            vulnerability-report.json
            vulnerability-report-fixable.json
            sbom.spdx.json

      - name: Log in to GHCR
        if: ${{ inputs.publish }}
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish immutable candidate and record digest
        if: ${{ inputs.publish }}
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          image="${IMAGE_REPOSITORY}:git-${{ inputs.expected_sha }}"
          docker push "$image"
          digest_ref="$(docker inspect --format='{{index .RepoDigests 0}}' "$image")"
          test -n "$digest_ref"
          digest="${digest_ref##*@}"
          printf 'digest_ref=%s\n' "$digest_ref" >> "$GITHUB_OUTPUT"
          printf 'digest=%s\n' "$digest" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$digest_ref" > image-digest.txt

      - name: Install Cosign
        if: ${{ inputs.publish }}
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac

      - name: Sign the published digest with GitHub OIDC
        if: ${{ inputs.publish }}
        env:
          DIGEST_REF: ${{ steps.publish.outputs.digest_ref }}
        run: cosign sign --yes "$DIGEST_REF"

      - name: Attest and verify registry provenance and SBOM
        if: ${{ inputs.publish }}
        env:
          DIGEST_REF: ${{ steps.publish.outputs.digest_ref }}
          SOURCE_REPOSITORY: ${{ github.server_url }}/${{ github.repository }}
          SOURCE_REVISION: ${{ inputs.expected_sha }}
          WORKFLOW_RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          WORKFLOW_IDENTITY: ${{ github.server_url }}/${{ github.repository }}/.github/workflows/backend-release.yml@${{ github.ref }}
        shell: bash
        run: |
          set -euo pipefail
          jq -n --arg repository "$SOURCE_REPOSITORY" --arg revision "$SOURCE_REVISION" \
            --arg image "$DIGEST_REF" --arg workflow "$WORKFLOW_RUN" \
            '{source_repository:$repository,source_revision:$revision,subject_image:$image,workflow_run:$workflow,build_platform:"linux/amd64"}' > provenance.json
          cosign attest --yes --type spdxjson --predicate sbom.spdx.json "$DIGEST_REF"
          cosign attest --yes --type custom --predicate provenance.json "$DIGEST_REF"
          identity="$WORKFLOW_IDENTITY"
          issuer="https://token.actions.githubusercontent.com"
          cosign verify --certificate-identity="$identity" --certificate-oidc-issuer="$issuer" "$DIGEST_REF" > signature-verification.json
          cosign verify-attestation --type spdxjson --certificate-identity="$identity" --certificate-oidc-issuer="$issuer" "$DIGEST_REF" > sbom-verification.json
          cosign verify-attestation --type custom --certificate-identity="$identity" --certificate-oidc-issuer="$issuer" "$DIGEST_REF" > provenance-verification.json

      - name: Attest build provenance
        if: ${{ inputs.publish && !github.event.repository.private }}
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be
        with:
          subject-name: ${{ env.IMAGE_REPOSITORY }}
          subject-digest: ${{ steps.publish.outputs.digest }}

      - name: Retain the published digest
        if: ${{ inputs.publish }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: backend-release-digest-${{ inputs.expected_sha }}
          path: |
            image-digest.txt
            provenance.json
            signature-verification.json
            sbom-verification.json
            provenance-verification.json
