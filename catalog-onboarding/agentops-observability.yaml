api_version: launchpad.redhat.com/v1alpha1
onboarding_contract: catalog-onboarding/agentops-observability.yaml

catalog:
  catalog_item_id: agentops-observability
  display_name: "AgentOps in Production: End-to-End Observability with Red Hat AI"
  description: >-
    Investigate a production-style multi-agent mortgage application through
    OpenShift metrics and logs, Grafana dashboards, MLflow tracing and
    evaluation, and Red Hat OpenShift AI pipelines on Intel infrastructure.
  category: guided_build
  version: "0.1.0"
  supported_branding:
    - redhat-intel-default
    - intel-internal

sources:
  showroom:
    repo_url: "https://github.com/rhpds/launchpad.git"
    revision: "0d697f3ddd1e5008dfd9bb32c3e3bdd0398383a9"
    playbook: site-agentops-observability.yml
    start_path: content-agentops-observability
  workload:
    repo_url: "https://github.com/rhpds/launchpad.git"
    revision: "6936ee6b9d64df8ccda8902279b8cc3a1e4c0545"
    deploy_path: deploy/workloads/agentops-seat

references:
  upstream_showroom:
    repo_url: "https://github.com/rhpds/agentops-intel-showroom.git"
    revision: "f1881c61de55ebf5640c27e76469f4efe458edaf"
    path: content
  agnosticv:
    repo_url: "https://github.com/rhpds/agnosticv.git"
    revision: "48fc6eebedb295bddf1b915a230e5e90f89db0af"
    path: agd_v2/agentops-intel
  automation:
    repo_url: "https://github.com/rhpds/agentops-in-prod-automation.git"
    revision: "6ea100531ac869fa66abe69ae223d6b56dbce9a2"
    path: bootstrap
  application:
    repo_url: "https://github.com/rh-ai-quickstart/multi-agent-loan-origination.git"
    revision: "1e50e51c334c1b6ed854d81a3f28fd324792f481"
    path: deploy/helm/mortgage-ai

runtime:
  deployment_type: helm
  deployment_scope: seat
  provisioner_refs:
    - helm-workload
    - showroom
  validation_refs:
    - pod-ready
    - route-accessible
    - inference-health
    - agentops-journey
  observability_profile: agentops-full-stack
  default_hardware_profile: xeon-basic
  default_quota_profile: large
  default_ttl: "4h"
  inference_endpoint: litellm
  required_capabilities:
    - openshift
    - showroom
    - model_endpoint
    - embedding_endpoint
    - agentops_observability_stack
    - rhoai
    - mlflow
    - user_workload_monitoring
    - openshift_logging
    - data_science_pipelines
  required_models:
    - granite-3.2-8b-tools
  seat_resources:
    # Rounded reservation envelope measured from the Arena one-seat chart
    # (1.73 CPU, 4.96 GiB, 13 pods, 30 GiB) plus one Showroom pod
    # (0.115 CPU, 336 MiB). Re-measure after shared embedding is enabled.
    cpu_millicores: 2000
    memory_mib: 6144
    pods: 14
    storage_gib: 30
  tabs:
    - id: openshift-console
      title: OpenShift Console
      source: cluster.console_url
    - id: terminal
      title: Terminal
      source: showroom.terminal
    - id: mlflow
      title: MLflow Console
      source: cluster.mlflow_url
    - id: mortgage-ai
      title: Mortgage AI App
      source: workload.route.ui
    - id: grafana
      title: Grafana
      source: workload.route.grafana
    - id: rhoai
      title: RHOAI Console
      source: cluster.rhoai_url
    - id: mlflow-docs
      title: MLflow Docs
      source: https://mlflow.org/docs/latest/genai/tracing/
    - id: rhoai-docs
      title: RHOAI Docs
      source: https://docs.redhat.com/en/documentation/red_hat_openshift_ai_self-managed/
  workload:
    source_kind: launchpad-seat-chart
    gitops_ready: false
    release_name: agentops
    identity_value_path: identity
    runtime_secret_name: agentops-runtime
    runtime_secret_value_path: runtime.existingSecret
    runtime_secret_sources:
      POSTGRES_DB: {value: mortgage-ai}
      POSTGRES_USER: {value: agentops}
      POSTGRES_PASSWORD: {source: generated_password, length: 32}
      LENDING_DB_PASSWORD: {source: generated_password, length: 32}
      COMPLIANCE_DB_PASSWORD: {source: generated_password, length: 32}
      MIGRATION_DATABASE_URL:
        template: >-
          postgresql+asyncpg://{POSTGRES_USER}:{POSTGRES_PASSWORD}@mortgage-ai-db:5432/mortgage-ai
      DATABASE_URL:
        template: >-
          postgresql+asyncpg://lending_app:{LENDING_DB_PASSWORD}@mortgage-ai-db:5432/mortgage-ai
      COMPLIANCE_DATABASE_URL:
        template: >-
          postgresql+asyncpg://compliance_app:{COMPLIANCE_DB_PASSWORD}@mortgage-ai-db:5432/mortgage-ai
      DEBUG: {value: "false"}
      ALLOWED_HOSTS: {value: '["*"]'}
      COMPANY_NAME: {value: "Fed Aura Capital"}
      AGENT_NAME: {value: "Intel Xeon AgentOps"}
      AUTH_DISABLED: {value: "true"}
      S3_ACCESS_KEY: {source: generated_password, length: 24}
      S3_SECRET_KEY: {source: generated_password, length: 32}
      S3_ENDPOINT: {value: "http://minio-service:9000"}
      S3_BUCKET: {value: documents}
      S3_REGION: {value: us-east-1}
      UPLOAD_MAX_SIZE_MB: {value: "50"}
      LLM_API_KEY: {source: maas_api_key}
      LLM_BASE_URL: {source: maas_endpoint}
      LLM_MODEL: {source: requested_model}
      LLM_MODEL_FAST: {source: requested_model}
      LLM_MODEL_CAPABLE: {source: requested_model}
      EMBEDDING_MODEL: {value: nomic-embed-text-v1.5}
      EMBEDDING_PROVIDER: {value: openai_compatible}
      EMBEDDING_BASE_URL:
        source: model_endpoint
        model: nomic-embed-text-v1.5
      MLFLOW_TRACKING_URI:
        value: "https://mlflow.redhat-ods-applications.svc.cluster.local:8443"
      MLFLOW_EXPERIMENT_NAME: {value: mortgage-ai}
      MLFLOW_WORKSPACE: {source: namespace}
      MLFLOW_TRACKING_AUTH: {value: kubernetes}
      MLFLOW_TRACKING_INSECURE_TLS: {value: "true"}
    helm_values:
      storageClass: nfs-storage
    routes:
      ui: mortgage-ai-ui-route
      grafana: grafana-route

certification:
  stage: implementation
  max_workshop_seats: 1
  promotion_sequence:
    - 1
    - 5
    - 25
  activation_blockers:
    - >-
      Repeat the one-seat run through the Launchpad provisioner. The pinned
      chart, application agent path, DSPA, Grafana, and zero-residue Helm
      reclaim were proven live on Arena, but the test did not create a
      persisted Launchpad order, workload Application, or Showroom.
    - >-
      Prove generated runtime Secret creation, retry preservation, model-key
      revocation, and Launchpad-driven reclaim live. The direct chart reclaim
      left zero residue, and unit tests confirm that no credentials are
      serialized into the Argo CD Application.
    - >-
      Validate generated URLs for all eight RHDP tabs: OpenShift Console,
      Terminal, shared MLflow, per-seat Mortgage AI, per-seat Grafana, shared
      RHOAI, MLflow Docs, and RHOAI Docs.
    - >-
      Deploy and live-certify the Launchpad entitlement gateway proxy for
      every participant workload and shared-service route, including
      cross-seat and cross-tenant denial. Local contracts prove catalog-only
      allowlisting, Showroom tab rewriting, WebSocket support, and origin
      escape rejection.
    - >-
      Install and certify an Arena participant route for shared MLflow,
      per-seat Grafana, and OpenShift Logging/Loki. OpenShift AI 3.5, a Ready
      DataScienceCluster, user workload monitoring, and Data Science Pipelines
      were confirmed live on 2026-09-04.
    - >-
      Re-run the AgentOps seat through Launchpad with the shared Arena Nomic
      endpoint and prove all seeded knowledge-base chunks receive vectors.
      The private cached endpoint and cluster-specific runtime injection are
      live, but the application ingestion path has not yet been re-certified.
    - >-
      Complete one-seat functional certification, including app, trace,
      metrics, logs, evaluation, Showroom, access isolation, and full reclaim.
