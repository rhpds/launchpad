api_version: launchpad.redhat.com/v1alpha1
onboarding_contract: catalog-onboarding/multi-agent-quickstart.yaml

catalog:
  catalog_item_id: multi-agent-quickstart
  display_name: "Build Multi-Agent AI Systems with Open Protocols"
  description: >-
    Build and inspect three cooperating A2A agents with semantic routing, MCP
    tool calling, guardrails, service authentication, and OpenTelemetry on
    Intel infrastructure and Red Hat OpenShift.
  category: guided_build
  version: "0.1.0"
  supported_branding:
    - redhat-intel-default
    - intel-internal

sources:
  showroom:
    repo_url: "https://github.com/rhpds/launchpad.git"
    revision: "c9b3baa8a0126233a543cef9c5c337e54bda7668"
    playbook: site-multi-agent-quickstart.yml
    start_path: content-multi-agent-quickstart
  workload:
    repo_url: "https://github.com/rhpds/launchpad.git"
    revision: "db8ff9cf775df07ebddb1eac2566cfebde462676"
    deploy_path: deploy/workloads/multi-agent-seat

references:
  original_lab:
    repo_url: "https://github.com/jkershawrh/multi-agent-quickstart.git"
    revision: "8a8e0241265e69be81bf28060c4a96be38d5c244"
    path: .

runtime:
  namespace_slug: multi-agent
  deployment_type: helm
  deployment_scope: seat
  showroom_terminal_storage: false
  provisioner_refs:
    - helm-workload
    - showroom
  validation_refs:
    - pod-ready
    - route-accessible
    - inference-health
    - multi-agent-journey
  observability_profile: multi-agent-open-protocols
  default_hardware_profile: xeon-basic
  default_quota_profile: large
  default_ttl: "4h"
  inference_endpoint: litellm
  required_capabilities:
    - openshift
    - showroom
    - model_endpoint
  required_models:
    - granite-3.2-8b-tools
  seat_resources:
    # One seven-container workload pod plus one Showroom pod. The envelope
    # includes measured Showroom requests and headroom above the chart's 800m.
    cpu_millicores: 1200
    memory_mib: 2048
    pods: 2
    storage_gib: 0
  workshop_provision_concurrency: 2
  tabs:
    - id: terminal
      title: Terminal
      source: showroom.terminal
    - id: workspace
      title: Multi-Agent Workspace
      source: workload.route.ui
    - id: openshift-console
      title: OpenShift Console
      source: cluster.console_url
  workload:
    source_kind: launchpad-seat-chart
    gitops_ready: true
    release_name: multi-agent
    identity_value_path: identity
    runtime_secret_name: multi-agent-runtime
    runtime_secret_value_path: runtime.existingSecret
    runtime_secret_sources:
      MODEL_ENDPOINT: {source: maas_endpoint}
      MODEL_API_KEY: {source: maas_api_key}
      MODEL_NAME: {source: requested_model}
      AGENT_AUTH_TOKEN: {source: generated_password, length: 48}
    helm_values:
      image:
        repository: >-
          image-registry.openshift-image-registry.svc:5000/partner-ai-launchpad/multi-agent-quickstart
        digest: sha256:dd509328e0c8c22925d4ee10734c640cb42295bbb01e170d3bfe76c2d83e425a
    routes:
      ui: multi-agent-ui
      orchestrator: multi-agent

certification:
  stage: one-seat-runtime-candidate
  max_workshop_seats: 1
  promotion_sequence:
    - 1
    - 5
    - 25
  activation_blockers:
    - >-
      Mirror the Arena-built, digest-pinned candidate image to a durable
      external registry or durable control-plane mirror before production;
      Arena's internal registry is sufficient only for certification.
    - >-
      Add inference-aware readiness and validate a real three-agent A2A
      workflow, MCP tool enrichment, semantic routing, and guardrail denial.
    - >-
      Complete one-seat participant authorization, cross-seat denial, and
      zero-residue reclaim evidence on Arena before activation.
    - >-
      Complete measured five-seat and twenty-five-seat certification before
      raising the catalog workshop limit above the proven safe value.
