decision: >-
  Keep the catalog item draft. Source intake is valid, but the AgentOps
  experience passed one internal Launchpad-created seat, including the
  namespaced runtime Secret, operator-aware readiness, participant journey,
  logging isolation, and automatic zero-residue reclaim. Keep the item capped
  at one seat until pipeline TLS and logging storage are suitable for five-seat
  testing. Shared MLflow is now backed by persistent PostgreSQL over verified
  service-ca TLS. Public-code access and trusted public TLS remain separate
  certification gates.
