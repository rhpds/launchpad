  what_this_signature_does: >-
    It records that a human holding the named role reviewed the advisory, both
    matches, the build-tag basis, the failed upgrade attempts and the
    reachability limits for the specific scanned build, and decided that the
    finding is acceptable within the stated scope until the expiry date.
  what_this_signature_does_not_do:
    - It does not publish, promote, push or otherwise make any image pullable.
    - It does not clear the scanner gate for any build, past or future.
    - It does not accept any finding other than the two enumerated GO-2026-5932 matches.
    - It does not assert that the image is safe, only that this finding is scoped and time-bounded.
    - It does not cover the terminal image, skopeo, helm verify, or human shell access in the backend container.
  gate_effect: >-
    None. scripts/check_backend_staging_security.py consumes enumerated
    launchpad/risk-acceptance/v1 triples and does not read this schema. A build
    whose report contains this finding still fails the gate until a separate
    acceptance covering that build's exact triples is materialised for it.
  gate_effect_observed:
