    note: >-
      The gate has no argument or code path that reads this schema; its only
      acceptance input is --acceptance with launchpad/risk-acceptance/v1.
  next_promoted_backend_build: >-
    Reopens this disposition by construction. A promoted build is a different
    digest, therefore a different image, therefore a new scan and a new review;
    this signature cannot be carried forward to it.
  known_findings_outside_scope: >-
    The backend build remains blocked on High findings that this record does not
    touch: the RPM matches behind their advisories plus the non-fixable Go
    findings, which are vendor-wait. Recorded as 30 RPM High matches across 11
