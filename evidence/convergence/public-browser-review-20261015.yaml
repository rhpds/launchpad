findings:
  - id: PUBLIC-LOGIN-CONTRAST
    severity: usability
    status: open
    observation: Pale heading and field labels render on a white login card and are difficult to read.
    screenshot: evidence/runs/public-login-contrast-defect-20261015.jpg
    source_deployment_drift: Deployed login copy/layout differs from the current repository template; exact deployed theme artifact must be identified before fixing.
  - id: PUBLIC-CONSOLE-INITIAL-LOAD
    severity: usability
    status: observed-eventually-loaded
    observation: Embedded Console initially displayed a spinner over multiple observations, then loaded the namespace pod list without separate login or a new tab. No precise latency measurement was captured.
  - id: PUBLIC-TERMINAL-STATE-LOSS
    severity: learner-workflow
    status: reproduced
    observation: 501 terminal disconnected while reviewing Story. Enter reconnected successfully to a fresh shell, but the previously exported QUAL_URL was UNSET.
    screenshot: evidence/runs/virtualization-501-terminal-state-loss-20261015.jpg
  - id: V501-STORY-API-405
    severity: functional-integration
    status: reproduced
    observation: Run qualification conditions and the next capacity condition both displayed Live endpoint returned HTTP 405. Story clearly labeled the fallback as REHEARSAL; this does not prove deployed API connectivity.
    screenshot: evidence/runs/virtualization-501-story-api-405-20261015.jpg
    source_review: src/live/demoAdapter.ts in the pinned 501 source uses an origin-absolute /api/v1/qualifications POST, not the order-scoped tool adapter route. The browser observed HTTP 405; full request routing diagnosis and a regression test remain required.
