removed_tools:
  odo:
    removal_authorized_by_owner: 2026-10-16
    rationale: >-
      Upstream redhat-developer/odo and the Red Hat client mirror both ended
      at v3.16.1 (built with go1.21.10); no fixed artifact exists. No lab
      content references odo (zero hits across showroom and catalog sources).
      It carried 21 Critical + 106 High fixable findings in the preceding
      complete-image scan (evidence/convergence/terminal-os-refresh-20261015.yaml).
    restore_path: >-
      Re-add a checksum-pinned vendor or source-built odo when a fixed
      upstream release exists or lab content requires the tool.
runtime_user_regression:
  defect: >-
    The el10 package upgrade consolidates /etc/passwd and drops the base
    image's hand-added uid 1001 entry; learner CLIs performing user lookups
    fail with "user: unknown userid 1001". Predates this branch; exposed by
    the new odo version assertion in the isolated runtime check.
  fix: Containerfile restores the exact inherited passwd entry after dnf upgrade.
  ci_proof: https://github.com/jkershawrh/intel-ai-launchpad/actions/runs/38915736986
remaining_blockers:
  - >-
    go stdlib advisory batch fixed only in go1.26.9/1.27.2: kn, opc, roxctl,
    tkn, tkn-pac and oc/kubectl vendor builds predate the fixed toolchains.
    Clearing requires vendor respins; no waiver.
  - >-
    Vendor dependency lag: x/net, grpc, buildkit, fulcio, spdystream,
    go-jose, go-billy, go-archive and distribution findings inside the
    refreshed vendor binaries. Clearing requires upstream dependency bumps.
  - skopeo vendored x/net and grpc lag their fixed versions at the v1.24.1 tag.
limits:
  - Local grype preview numbers are not release evidence; the authoritative
    complete-image scan is the CI vulnerability gate on the exact commit.
  - The runtime compatibility proof covers version commands offline; it does
    not re-execute full lab journeys.
  - No security exception, suppression or scanner ignore was added.
