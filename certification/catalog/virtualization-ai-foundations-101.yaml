api_version: launchpad.redhat.com/v1alpha1
kind: CatalogCertification
metadata:
  catalog_item_id: virtualization-ai-foundations-101
  display_name: "Virtualization + AI 101: Trace a VM to Governed AI"
spec:
  target_cluster: flightpath
  kubeconfig_server: https://api.flightpath.fm2aihpcsed.com:6443
  allowed_exposure_policies: [internal, public_code]
  scale_profiles:
    - {seats: 1, required_consecutive_runs: 1, probe_concurrency: 1, maximum_ready_seconds: 1200, maximum_cleanup_seconds: 600}
  showroom:
    pages:
      - {id: welcome, path: /www/virtualization-ai-101/main/index.html, marker: "Trace a VM to Governed AI"}
      - {id: verify, path: /www/virtualization-ai-101/main/01-verify.html, marker: "Verify the runtime"}
      - {id: trace, path: /www/virtualization-ai-101/main/02-trace.html, marker: "Trace the boundaries"}
      - {id: invoke, path: /www/virtualization-ai-101/main/03-invoke.html, marker: "Invoke from inside the VM"}
      - {id: inspect, path: /www/virtualization-ai-101/main/04-inspect.html, marker: "Inspect AI evidence"}
      - {id: failure, path: /www/virtualization-ai-101/main/05-failure.html, marker: "Exercise safe failure"}
      - {id: evidence, path: /www/virtualization-ai-101/main/06-evidence.html, marker: "Export the evidence map"}
      - {id: cleanup, path: /www/virtualization-ai-101/main/07-cleanup.html, marker: "Clean learner artifacts"}
      - {id: conclusion, path: /www/virtualization-ai-101/main/99-conclusion.html, marker: "Conclusion"}
  seat_probe:
    argv: [bash, scripts/certify-virtualization-ai-seat.sh, virtualization-ai-foundations-101, "{namespace}", "{cluster_ref}"]
    timeout_seconds: 900
    result_format: json
    json_assertions: &assertions
      - {path: result, equals: GREEN-live-internal-seat}
      - {path: cluster_ref, equals: flightpath}
      - {path: provenance.source_revision, equals: e881ece208528720974f4e7bc659a0c8ad0627fb}
      - {path: runtime_images.presentation, equals: "ghcr.io/jkershawrh/virtualization-ai-foundations-presentation@sha256:723b28c736cac152e7872a8b5ec146f877ab1baf78b2e4375ce31a53e346c378"}
      - {path: runtime_images.adapter, equals: "ghcr.io/jkershawrh/virtualization-ai-foundations-adapter@sha256:775377060ec11006604f458c887357e1fc32c71c3cdf89411719cd4e3eef3586"}
      - {path: readiness.vms_running, equals: 1}
      - {path: readiness.vmis_ready, equals: 1}
      - {path: readiness.presentation_http_status, equals: 200}
      - {path: readiness.adapter_health, equals: true}
      - {path: journey.source_state, equals: LIVE}
      - {path: journey.outcome, equals: live-advisory}
      - {path: journey.request_origin, equals: operations-vm}
      - {path: journey.model_participated, equals: true}
      - {path: journey.model, equals: granite-3.2-8b-tools}
      - {path: journey.hardware, equals: Intel Xeon CPU}
      - {path: journey.human_authority_preserved, equals: true}
      - {path: terminal_scope, contains: own_edit=yes}
      - {path: terminal_scope, contains: cross_namespace=DENIED}
      - {path: terminal_scope, contains: node_list=DENIED}
      - {path: operator_journey.console_url_present, equals: true}
      - {path: contains_sensitive_values, equals: false}
  cleanup: &cleanup
    resources: [namespaces, applications.argoproj.io, rolebindings.rbac.authorization.k8s.io, persistentvolumeclaims, persistentvolumes, routes.route.openshift.io, secrets]
  rubric: &rubric
    required_score: 100
    categories:
      - {id: contract_integrity, weight: 10, requires: [contract_valid, evidence_hashed]}
      - {id: placement_capacity, weight: 15, requires: [capacity_passed, single_cluster_assignment]}
      - {id: provisioning_readiness, weight: 20, requires: [all_seats_ready, ready_within_limit]}
      - {id: participant_function, weight: 25, requires: [showroom_pages_passed, seat_probes_passed]}
      - {id: authorization, weight: 15, requires: [namespace_isolation_passed, sensitive_values_absent]}
      - {id: cleanup, weight: 15, requires: [cleanup_completed, zero_residue_cleanup, model_keys_revoked]}
