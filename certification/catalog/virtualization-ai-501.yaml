api_version: launchpad.redhat.com/v1alpha1
kind: CatalogCertification
metadata: {catalog_item_id: virtualization-ai-501, display_name: "Virtualization + AI 501: Qualify a Governed VM Inference Fleet"}
spec:
  target_cluster: flightpath
  kubeconfig_server: https://api.flightpath.fm2aihpcsed.com:6443
  allowed_exposure_policies: [internal, public_code]
  scale_profiles:
    - {seats: 1, required_consecutive_runs: 1, probe_concurrency: 1, maximum_ready_seconds: 1500, maximum_cleanup_seconds: 600}
  showroom:
    pages:
      - {id: welcome, path: /www/virtualization-ai-501/index.html, marker: "Qualify a Governed VM Inference Fleet"}
      - {id: discover, path: /www/virtualization-ai-501/01-discover.html, marker: "DISCOVER"}
      - {id: baseline, path: /www/virtualization-ai-501/02-baseline.html, marker: "BASELINE"}
      - {id: migrate, path: /www/virtualization-ai-501/03-migrate.html, marker: "MIGRATE"}
      - {id: disrupt, path: /www/virtualization-ai-501/04-disrupt.html, marker: "DISRUPT"}
      - {id: correlate, path: /www/virtualization-ai-501/05-correlate.html, marker: "CORRELATE"}
      - {id: qualify, path: /www/virtualization-ai-501/06-qualify.html, marker: "QUALIFY"}
      - {id: handoff, path: /www/virtualization-ai-501/07-handoff-reclaim.html, marker: "HANDOFF and participant cleanup"}
      - {id: conclusion, path: /www/virtualization-ai-501/99-conclusion.html, marker: "Conclusion"}
  seat_probe:
    argv: [bash, scripts/certify-virtualization-ai-seat.sh, virtualization-ai-501, "{namespace}", "{cluster_ref}"]
    timeout_seconds: 1200
    result_format: json
    json_assertions:
      - {path: result, equals: GREEN-live-internal-seat}
      - {path: cluster_ref, equals: flightpath}
      - {path: provenance.source_revision, equals: 6e5212e685d28781dcded0208ffece07aa07f6c2}
      - {path: restart_evidence_preserved, equals: true}
      - {path: runtime_images.presentation, equals: "ghcr.io/jkershawrh/virtualization-ai-501-presentation@sha256:825fa99269c1bed2af4d1a3190203a29488ab032983e1e255d9b730963819acf"}
      - {path: runtime_images.adapter, equals: "ghcr.io/jkershawrh/virtualization-ai-501-qualification-adapter@sha256:256400deedfe2103fd887f7665f9813039e1d613252d1e230683b8b82d4512b1"}
      - {path: readiness.vms_running, equals: 3}
      - {path: readiness.vmis_ready, equals: 3}
      - {path: readiness.presentation_http_status, equals: 200}
      - {path: readiness.adapter_health, equals: true}
      - {path: journey.outcome, equals: ALLOW_REVIEW}
      - {path: journey.human_authority_preserved, equals: true}
      - {path: terminal_scope, contains: own_edit=yes}
      - {path: terminal_scope, contains: cross_namespace=DENIED}
      - {path: terminal_scope, contains: node_list=DENIED}
      - {path: contains_sensitive_values, equals: false}
  cleanup:
    resources: [namespaces, applications.argoproj.io, rolebindings.rbac.authorization.k8s.io, persistentvolumeclaims, persistentvolumes, routes.route.openshift.io, secrets]
  rubric:
    required_score: 100
    categories:
      - {id: contract_integrity, weight: 10, requires: [contract_valid, evidence_hashed]}
      - {id: placement_capacity, weight: 15, requires: [capacity_passed, single_cluster_assignment]}
      - {id: provisioning_readiness, weight: 20, requires: [all_seats_ready, ready_within_limit]}
      - {id: participant_function, weight: 25, requires: [showroom_pages_passed, seat_probes_passed]}
      - {id: authorization, weight: 15, requires: [namespace_isolation_passed, sensitive_values_absent]}
      - {id: cleanup, weight: 15, requires: [cleanup_completed, zero_residue_cleanup, model_keys_revoked]}
